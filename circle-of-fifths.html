<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── Web Audio ──────────────────────────────────────────────────── */
const SEMI = {C:0,Db:1,D:2,Eb:3,E:4,F:5,Gb:6,G:7,Ab:8,A:9,Bb:10,B:11};
function toHz(note, oct=4){
  const s=SEMI[note]; if(s===undefined) return 440;
  return 440*Math.pow(2,((oct+1)*12+s-69)/12);
}
function playNotes(ctx, notes, oct, dur, delay=0){
  notes.forEach(note=>{
    const osc=ctx.createOscillator(), g=ctx.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(toHz(note,oct), ctx.currentTime+delay);
    g.gain.setValueAtTime(0, ctx.currentTime+delay);
    g.gain.linearRampToValueAtTime(0.16, ctx.currentTime+delay+0.025);
    g.gain.setValueAtTime(0.16, ctx.currentTime+delay+dur-0.08);
    g.gain.linearRampToValueAtTime(0, ctx.currentTime+delay+dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(ctx.currentTime+delay); osc.stop(ctx.currentTime+delay+dur);
  });
}

/* ── Music data ─────────────────────────────────────────────────── */
// Circle of Fifths — C=index 0 at 12 o'clock, clockwise
const COF   = ['C','G','D','A','E','B','Gb','Db','Ab','Eb','Bb','F'];
const CHROM = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];

// Relative minor of each COF major key (inner ring, same angle)
// C→Am, G→Em, D→Bm, A→Gbm, E→Dbm, B→Abm, Gb→Ebm, Db→Bbm, Ab→Fm, Eb→Cm, Bb→Gm, F→Dm
const REL_MIN = {C:'A',G:'E',D:'B',A:'Gb',E:'Db',B:'Ab',Gb:'Eb',Db:'Bb',Ab:'F',Eb:'C',Bb:'G',F:'D'};
const REL_MAJ = {A:'C',E:'G',B:'D',Gb:'A',Db:'E',Ab:'B',Eb:'Gb',Bb:'Db',F:'Ab',C:'Eb',G:'Bb',D:'F'};

// KCM 12-Color Chromatic Spectrum™
const COLORS = {
  C:'#FFFF00',Db:'#FFC400',D:'#FF8000',Eb:'#FF4000',
  E:'#FF0000',F:'#C4007F',Gb:'#8000FF',G:'#4000FF',
  Ab:'#0000FF',A:'#007FFF',Bb:'#00FF80',B:'#80FF00'
};
const DARK_INK = new Set(['C','Db','D','Bb','B']);

// Display formatter — converts internal flat notation to proper ♭ symbol
// Only used for rendering text to the user, never for music logic
const FMT = {Db:'D♭',Eb:'E♭',Gb:'G♭',Ab:'A♭',Bb:'B♭'};
const fmt = n => FMT[n]||n;  // e.g. fmt('Eb') → 'E♭', fmt('G') → 'G' // bright colors need dark text

const F2S = {Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'};
const S2F = {'C#':'Db','D#':'Eb','F#':'Gb','G#':'Ab','A#':'Bb'};
const toSharp = n => F2S[n]||n;
const toFlat  = n => S2F[n]||n;

const majTriad = r => { const i=CHROM.indexOf(r); return [r,CHROM[(i+4)%12],CHROM[(i+7)%12]]; };
const minTriad = r => { const i=CHROM.indexOf(r); return [r,CHROM[(i+3)%12],CHROM[(i+7)%12]]; };

// I IV V: IV = 1 step CCW (idx-1), V = 1 step CW (idx+1)
function getIVV(majorIdx){
  return {
    I:  COF[majorIdx],
    IV: COF[(majorIdx+11)%12],
    V:  COF[(majorIdx+1)%12],
  };
}

/* ── Diatonic engine ──────────────────────────────────────────────────
   Builds chords from any root using major OR natural minor scale.
   Major scale:        [0,2,4,5,7,9,11]  — I IIm IIIm IV V VIm VII°
   Natural minor scale:[0,2,3,5,7,8,10]  — i II° III iv v VI VII
   All progressions auto-transpose from locked root.
──────────────────────────────────────────────────────────────────────── */
const MAJ_SCALE  = [0,2,4,5,7,9,11];
const MIN_SCALE  = [0,2,3,5,7,8,10];
const MAJ_MINOR  = [false,true,true,false,false,true,true];  // chord quality in major
const MIN_MINOR  = [true,true,false,true,true,false,false];  // chord quality in minor

function diatonicChord(root, degree, useMinor) {
  const ri  = CHROM.indexOf(root);
  const scl = useMinor ? MIN_SCALE : MAJ_SCALE;
  const qlt = useMinor ? MIN_MINOR : MAJ_MINOR;
  const idx = (ri + scl[degree % 7]) % 12;
  return { n: CHROM[idx], m: qlt[degree % 7] };
}

function buildProg(root, degrees, useMinor) {
  return degrees.map(d => diatonicChord(root, d, useMinor));
}

// Roman numeral display
const R_MAJ = ['I','II','III','IV','V','VI','VII'];
const R_MIN = ['i','ii°','III','iv','v','VI','VII'];

/* ── Progression library ──────────────────────────────────────────────
   mode:'maj' = uses major scale from majorRoot
   mode:'min' = uses natural minor scale from relMin (Am when root is C)
   degrees = indices into the 7-note diatonic scale (0=tonic, 3=4th, 4=5th etc)
──────────────────────────────────────────────────────────────────────── */
const PROGRESSIONS = [
  // ── MAJOR ─────────────────────────────────────────────────────────
  { mode:'maj', roman:'I · IV · V',
    name:'The Big Three',
    degrees:[0,3,4],
    ex:'C · F · G' },

  { mode:'maj', roman:'I · IIm · IIIm · IV · V',
    name:'Scale Walk Up',
    degrees:[0,1,2,3,4],
    ex:'C · Dm · Em · F · G' },

  { mode:'maj', roman:'I · VIm · IV · V',
    name:'50s Classic',
    degrees:[0,5,3,4],
    ex:'C · Am · F · G' },

  { mode:'maj', roman:'I · VIm · IIm · V',
    name:'1 · 6 · 2 · 5',
    degrees:[0,5,1,4],
    ex:'C · Am · Dm · G' },

  { mode:'maj', roman:'IIm · V · I',
    name:'2 · 5 · 1',
    degrees:[1,4,0],
    ex:'Dm · G · C' },

  { mode:'maj', roman:'IIIm · VIm · IIm · V',
    name:'3 · 6 · 2 · 5',
    degrees:[2,5,1,4],
    ex:'Em · Am · Dm · G' },

  { mode:'maj', roman:'I · V · VIm · IV',
    name:'Pop Anthem',
    degrees:[0,4,5,3],
    ex:'C · G · Am · F' },

  { mode:'maj', roman:'I · IV · I · V',
    name:'Blues Turnaround',
    degrees:[0,3,0,4],
    ex:'C · F · C · G' },

  // ── MINOR ─────────────────────────────────────────────────────────
  { mode:'min', roman:'i · iv · v',
    name:'Minor 1 · 4 · 5',
    degrees:[0,3,4],
    ex:'Am · Dm · Em' },

  { mode:'min', roman:'i · VI · III · VII',
    name:'Minor Epic',
    degrees:[0,5,2,6],
    ex:'Am · F · C · G' },

  { mode:'min', roman:'i · VII · VI · V',
    name:'Andalusian Cadence',
    degrees:[0,6,5,4],
    ex:'Am · G · F · E' },

  { mode:'min', roman:'IIm · V · i',
    name:'2 · 5 · 1 Minor',
    degrees:[1,4,0],
    ex:'Bm · E · Am' },
];

/* ── Component ──────────────────────────────────────────────────── */
function MusicCircle() {
  const [rootIdx,  setRootIdx]  = useState(0);   // index into COF array
  const [isMinor,  setIsMinor]  = useState(false);
  const [flash,    setFlash]    = useState(null); // {note, type:'outer'|'inner'}
  const [playing,  setPlaying]  = useState(false);
  const [progFilter, setProgFilter] = useState('maj'); // 'maj'|'min'|'all'
  const [activeProg, setActiveProg] = useState(null);

  // Auto-sync prog filter tab when mode changes
  useEffect(()=>{ setProgFilter(isMinor?'min':'maj'); setActiveProg(null); },[isMinor]);
  const ctxRef    = useRef(null);
  const timers    = useRef([]);

  // Derived values
  const majorRoot = COF[rootIdx];
  const tonic     = isMinor ? (REL_MIN[majorRoot]||majorRoot) : majorRoot;
  const relMin    = REL_MIN[majorRoot]||majorRoot;
  const relMaj    = majorRoot;

  // I·IV·V — major uses COF positions; minor uses natural minor scale from relMin
  // Natural minor degrees: 0=i(Am), 3=iv(Dm), 4=v(Em) — all minor quality
  const {I,IV,V} = isMinor
    ? { I:  diatonicChord(relMin,0,true).n,
        IV: diatonicChord(relMin,3,true).n,
        V:  diatonicChord(relMin,4,true).n }
    : getIVV(rootIdx);

  const tonicClr  = COLORS[tonic]||'#008080';
  const ivClr     = COLORS[IV]||'#8B6BA3';
  const vClr      = COLORS[V]||'#CF7A5A';

  // Expose for KCM bridge
  useEffect(()=>{
    window._kcmCoF = {
      stop: ()=>{ clearTimers(); setPlaying(false); setFlash(null); if(ctxRef.current) ctxRef.current.suspend(); },
      setRoot: note => {
        const flat = toFlat(note)||note;
        // Could be a major or minor root
        const majIdx = COF.indexOf(flat);
        if(majIdx !== -1){ setRootIdx(majIdx); return; }
        // Try as minor root — find its relative major
        const relMajor = REL_MAJ[flat];
        if(relMajor){ const i=COF.indexOf(relMajor); if(i!==-1) setRootIdx(i); }
      },
      setIsMinor
    };
    window._kcmCoFStop = ()=>{ clearTimers(); setPlaying(false); setFlash(null); if(ctxRef.current) ctxRef.current.suspend(); };
    return ()=>{ delete window._kcmCoF; delete window._kcmCoFStop; };
  },[]);

  // Arrow key transpose
  useEffect(()=>{
    function onKey(e){
      if(e.key==='ArrowRight'||e.key==='ArrowUp'){ e.preventDefault(); doTranspose(1); }
      else if(e.key==='ArrowLeft'||e.key==='ArrowDown'){ e.preventDefault(); doTranspose(-1); }
    }
    window.addEventListener('keydown',onKey);
    return ()=>window.removeEventListener('keydown',onKey);
  });

  function getCtx(){
    if(!ctxRef.current||ctxRef.current.state==='closed')
      ctxRef.current=new(window.AudioContext||window.webkitAudioContext)();
    if(ctxRef.current.state==='suspended') ctxRef.current.resume();
    return ctxRef.current;
  }
  function clearTimers(){ timers.current.forEach(clearTimeout); timers.current=[]; }
  function stopAll(){
    clearTimers();
    setPlaying(false);
    setFlash(null);
    // Suspend audio context — cuts any notes currently playing immediately
    if(ctxRef.current && ctxRef.current.state === 'running'){
      ctxRef.current.suspend();
    }
  }

  // Play a single note (no chord) — used for sequence/progression playback
  function playNote(note, minor=false, delay=0){
    const ctx=getCtx();
    playNotes(ctx, [note], 4, 0.55, delay);  // single note, shorter duration
    const t1=setTimeout(()=>setFlash({note,type:minor?'inner':'outer'}), delay*1000);
    const t2=setTimeout(()=>setFlash(null), (delay+0.55)*1000);
    timers.current.push(t1,t2);
  }

  // Play a chord (triad) — used for direct note clicks only
  function playChord(note, minor=false, delay=0){
    const ctx=getCtx();
    const triad = minor ? minTriad(note) : majTriad(note);
    playNotes(ctx, triad, 4, 0.85, delay);
    const t1=setTimeout(()=>setFlash({note,type:minor?'inner':'outer'}), delay*1000);
    const t2=setTimeout(()=>setFlash(null), (delay+0.85)*1000);
    timers.current.push(t1,t2);
  }

  function doTranspose(dir){
    setRootIdx(prev=>{
      const next=(prev+dir+12)%12;
      const nextNote = COF[next];
      setTimeout(()=>{ playChord(nextNote, isMinor); postBus({root:toSharp(isMinor?(REL_MIN[nextNote]||nextNote):nextNote), mode:isMinor?'aeolian':'ionian'}); },0);
      return next;
    });
  }

  function selectMajor(note){
    const idx=COF.indexOf(note); if(idx===-1) return;
    setRootIdx(idx); setIsMinor(false);
    playChord(note, false);
    postBus({root:toSharp(note), mode:'ionian'});
    if(typeof trackEvent==='function') trackEvent('note_click',{event_category:'circle_of_fifths',event_label:note+'_major'});
  }

  function selectMinor(relMinNote){
    // relMinNote e.g. 'A' — find its relative major position on wheel
    const relMajor = REL_MAJ[relMinNote]||relMinNote;
    const idx = COF.indexOf(relMajor); if(idx===-1) return;
    setRootIdx(idx); setIsMinor(true);
    playChord(relMinNote, true);
    postBus({root:toSharp(relMinNote), mode:'aeolian'});
    if(typeof trackEvent==='function') trackEvent('note_click',{event_category:'circle_of_fifths',event_label:relMinNote+'_minor'});
  }

  function playIVV(){
    if(playing) return;
    stopAll(); setPlaying(true);
    const root = isMinor ? relMin : majorRoot;
    const seq = buildProg(root, [0,3,4,0], isMinor);
    // Sequential single notes — no chords
    seq.forEach(({n,m},i)=>playNote(n,m,0.15+i*0.7));
    const done=setTimeout(()=>{ setPlaying(false); setFlash(null); },(seq.length*700)+500);
    timers.current.push(done);
  }

  function playProg(prog){
    if(playing) return;
    stopAll(); setPlaying(true);
    // For minor progs: build from relMin (Am), using minor scale
    // For major progs: build from majorRoot (C), using major scale
    const root = prog.mode==='min' ? relMin : majorRoot;
    const useMinor = prog.mode==='min';
    const seq = buildProg(root, prog.degrees, useMinor);
    // Sequential single notes — hear the scale movement between chords
    seq.forEach(({n,m},i)=>playNote(n,m,0.15+i*0.7));
    const done=setTimeout(()=>{ setPlaying(false); setFlash(null); },(seq.length*700)+500);
    timers.current.push(done);
  }

  function postBus(patch){
    try{ window.parent.postMessage({type:'KCM_STATE_PATCH',payload:patch},'*'); }catch(e){}
  }

  /* ── SVG Wheel ────────────────────────────────────────────────── */
  const cx=250,cy=250,outerR=188,innerR=128,outerDot=27,innerDot=19;
  const angle = i => (i*30-90)*Math.PI/180;

  const notes = COF.map((note,i)=>{
    const a=angle(i);
    const ox=cx+outerR*Math.cos(a), oy=cy+outerR*Math.sin(a);
    const ix=cx+innerR*Math.cos(a), iy=cy+innerR*Math.sin(a); // SAME angle — Am inside C
    const relM = REL_MIN[note]||note;

    const isRoot     = note===majorRoot;
    const isIV       = note===IV && !isMinor;
    const isV        = note===V  && !isMinor;
    const isRelRoot  = isRoot && isMinor;
    const fOuter     = flash&&flash.note===note&&flash.type==='outer';
    const fInner     = flash&&flash.note===relM&&flash.type==='inner';
    const inkO       = DARK_INK.has(note)?'#000':'#fff';
    const inkI       = DARK_INK.has(relM)?'#000':'#fff';

    return React.createElement('g',{key:note},

      /* ── Outer dot selector ring ── */
      isRoot && React.createElement('circle',{cx:ox,cy:oy,r:outerDot+11,fill:'none',
        stroke:'#F4D03F',strokeWidth:2.5,opacity:.75,strokeDasharray:'5 3',
        style:{pointerEvents:'none'}}),

      /* ── IV / V subtle ring ── */
      (isIV||isV) && React.createElement('circle',{cx:ox,cy:oy,r:outerDot+7,fill:'none',
        stroke:'rgba(244,208,63,.28)',strokeWidth:1.5,style:{pointerEvents:'none'}}),

      /* ── Outer dot ── */
      React.createElement('circle',{cx:ox,cy:oy,r:outerDot,
        fill:COLORS[note]||'#888',
        stroke:isRoot?'#F4D03F':(isIV||isV)?'rgba(244,208,63,.45)':'rgba(255,255,255,.18)',
        strokeWidth:isRoot?3.5:1.5,
        opacity:fOuter?1:.9,
        style:{cursor:'pointer',filter:fOuter?`drop-shadow(0 0 22px ${COLORS[note]}) drop-shadow(0 0 40px ${COLORS[note]})`:isRoot?'drop-shadow(0 0 10px rgba(244,208,63,.7))':'none'},
        onClick:()=>selectMajor(note)
      }),

      /* ── Roman numeral above outer dot ── */
      (isRoot&&!isMinor||isIV||isV) && React.createElement('text',{
        x:ox,y:oy-outerDot-9,textAnchor:'middle',dominantBaseline:'central',
        fontSize:'11',fontWeight:'800',fill:'#F4D03F',
        style:{pointerEvents:'none',fontFamily:'Cinzel,serif'}
      }, isRoot&&!isMinor?'I':isIV?'IV':'V'),

      /* ── Outer label ── */
      React.createElement('text',{
        x:ox,y:oy+1,textAnchor:'middle',dominantBaseline:'central',
        fontSize:isRoot?'17':'15',fontWeight:'bold',fill:inkO,
        style:{pointerEvents:'none',userSelect:'none'}
      },fmt(note)),

      /* ── Major↔Minor toggle pill (only on active root) ── */
      isRoot && React.createElement('g',{
        onClick:()=>{
          const flip=!isMinor;
          setIsMinor(flip);
          playChord(flip?(REL_MIN[majorRoot]||majorRoot):majorRoot, flip);
          postBus({root:toSharp(flip?(REL_MIN[majorRoot]||majorRoot):majorRoot),mode:flip?'aeolian':'ionian'});
        },
        style:{cursor:'pointer'}
      },
        React.createElement('rect',{
          x:ox-20,y:oy+outerDot+6,width:40,height:16,rx:8,
          fill:isMinor?'rgba(0,128,128,.9)':'rgba(139,107,163,.9)',
          stroke:'rgba(255,255,255,.25)',strokeWidth:1
        }),
        React.createElement('text',{
          x:ox,y:oy+outerDot+14,textAnchor:'middle',dominantBaseline:'central',
          fontSize:'8',fontWeight:'700',fill:'white',
          style:{pointerEvents:'none',letterSpacing:'.5px'}
        },isMinor?'→ MAJ':'→ min')
      ),

      /* ── Inner dot selector ring (minor mode) ── */
      isRelRoot && React.createElement('circle',{cx:ix,cy:iy,r:innerDot+9,fill:'none',
        stroke:'#F4D03F',strokeWidth:2,opacity:.6,strokeDasharray:'4 3',
        style:{pointerEvents:'none'}}),

      /* ── Inner dot ── */
      React.createElement('circle',{cx:ix,cy:iy,r:innerDot,
        fill:COLORS[relM]||'#888',
        stroke:isRelRoot?'#F4D03F':'rgba(255,255,255,.14)',
        strokeWidth:isRelRoot?3:1.2,
        opacity:fInner?1:.85,
        style:{cursor:'pointer',filter:fInner?`drop-shadow(0 0 20px ${COLORS[relM]}) drop-shadow(0 0 35px ${COLORS[relM]})`:isRelRoot?'drop-shadow(0 0 8px rgba(244,208,63,.5))':'none'},
        onClick:()=>selectMinor(relM)
      }),

      /* ── Minor 'i' label above inner dot ── */
      isRelRoot && React.createElement('text',{
        x:ix,y:iy-innerDot-8,textAnchor:'middle',dominantBaseline:'central',
        fontSize:'10',fontWeight:'800',fill:'#F4D03F',
        style:{pointerEvents:'none',fontFamily:'Cinzel,serif'}
      },'i'),

      /* ── Inner label ── */
      React.createElement('text',{
        x:ix,y:iy+1,textAnchor:'middle',dominantBaseline:'central',
        fontSize:'11',fontWeight:'bold',fill:inkI,
        style:{pointerEvents:'none',userSelect:'none'}
      },fmt(relM)+'m')
    );
  });

  /* ── Render ───────────────────────────────────────────────────── */
  return React.createElement('div',{className:'wrap'},

    /* Title */
    React.createElement('div',{className:'title-block'},
      React.createElement('h2',null,'Circle of Fifths'),
      React.createElement('p',null,'Click any note to lock root · ◀ ▶ or arrow keys to transpose')
    ),

    /* Main 2-col grid */
    React.createElement('div',{className:'grid'},

      /* ── LEFT: Wheel + transpose below ── */
      React.createElement('div',{className:'wheel-wrap'},
        React.createElement('div',{className:'wheel-box'},

          /* SVG Wheel */
          React.createElement('svg',{
            viewBox:'0 0 500 500',
            style:{width:'100%',height:'auto',borderRadius:'50%',
              background:'radial-gradient(circle,#0d1525 0%,#050a12 100%)',
              boxShadow:'0 8px 40px rgba(0,0,0,.7),inset 0 0 60px rgba(0,128,128,.04)',
              border:'3px solid rgba(0,128,128,.3)'},
            role:'img','aria-label':'Circle of Fifths'
          },
            COF.map((_,i)=>{
              const a=angle(i);
              return React.createElement('line',{key:'sp'+i,
                x1:cx+68*Math.cos(a),y1:cy+68*Math.sin(a),
                x2:cx+218*Math.cos(a),y2:cy+218*Math.sin(a),
                stroke:'rgba(0,128,128,.1)',strokeWidth:1});
            }),
            React.createElement('circle',{cx,cy,r:215,fill:'none',stroke:'rgba(0,128,128,.12)',strokeWidth:1}),
            React.createElement('circle',{cx,cy,r:155,fill:'none',stroke:'rgba(139,107,163,.1)',strokeWidth:1}),
            React.createElement('circle',{cx,cy,r:105,fill:'none',stroke:'rgba(0,128,128,.07)',strokeWidth:1}),
            ...notes,
            React.createElement('circle',{cx,cy,r:66,fill:'#070d18',stroke:'rgba(0,128,128,.45)',strokeWidth:2.5}),
            React.createElement('text',{x:cx,y:cy,textAnchor:'middle',fontFamily:'Cinzel,serif',
              style:{dominantBaseline:'central'}
            },
              React.createElement('tspan',{x:cx,dy:'-0.55em',fontSize:'26',fontWeight:'900',
                fill:tonicClr,style:{filter:`drop-shadow(0 0 10px ${tonicClr}99)`}
              },fmt(tonic)+(isMinor?'m':'')),

              React.createElement('tspan',{x:cx,dy:'1.4em',fontSize:'9',
                fontFamily:'Montserrat,sans-serif',fill:'rgba(232,232,232,.35)',letterSpacing:'2'
              },isMinor?'MINOR':'MAJOR')
            ),
            React.createElement('polygon',{points:'250,12 244,26 256,26',fill:'#F4D03F',opacity:.85})
          ),

          /* Transpose — below wheel, inside left column */
          React.createElement('div',{className:'trans-row'},
            React.createElement('div',{style:{textAlign:'center'}},
              React.createElement('button',{className:'trans-btn',
                onClick:()=>doTranspose(-1),'aria-label':'Up a 4th'},'◀'),
              React.createElement('div',{className:'trans-lbl'},'+4th')
            ),
            React.createElement('div',{className:'root-pill'},
              React.createElement('div',{className:'root-note',
                style:{color:tonicClr,textShadow:`0 0 16px ${tonicClr}88`}
              },fmt(tonic)+(isMinor?'m':'')),

              React.createElement('div',{className:'root-lbl'},isMinor?'minor':'major')
            ),
            React.createElement('div',{style:{textAlign:'center'}},
              React.createElement('button',{className:'trans-btn',
                onClick:()=>doTranspose(1),'aria-label':'Up a 5th'},'▶'),
              React.createElement('div',{className:'trans-lbl'},'+5th')
            )
          ),
          React.createElement('div',{className:'key-hint'},'← → arrow keys also transpose')
        )
      ),

      /* ── RIGHT: Control Panel ── */
      React.createElement('div',{style:{display:'flex',flexDirection:'column',gap:'0.6rem'}},

        /* Progressions — top of right panel, biggest section */
        React.createElement('div',{className:'card',style:{flex:'1 1 auto'}},
          React.createElement('div',{className:'card-title',style:{color:'var(--coral)'}},
            'Progressions — '+fmt(tonic)+(isMinor?' minor':' major')),

          /* Major / Minor / All tabs */
          React.createElement('div',{className:'prog-tabs'},
            [{k:'maj',l:'Major'},{k:'min',l:'Minor'},{k:'all',l:'All'}].map(({k,l})=>
              React.createElement('button',{key:k,
                className:'prog-tab'+(progFilter===k?' active':''),
                onClick:()=>setProgFilter(k)
              },l)
            )
          ),

          /* 2-column grid */
          React.createElement('div',{className:'prog-grid'},
            PROGRESSIONS
              .filter(p=>progFilter==='all'||p.mode===progFilter)
              .map((p,i)=>{
                const root = p.mode==='min' ? relMin : majorRoot;
                const seq  = buildProg(root, p.degrees, p.mode==='min');
                const chordNames = seq.map(({n,m})=>fmt(n)+(m?'m':'')).join(' · ');
                const id = p.mode+i;
                return React.createElement('button',{key:id,
                  className:'prog-item'+(activeProg===id?' active':''),
                  disabled:playing,
                  onClick:()=>{ setActiveProg(id); playProg(p); }
                },
                  React.createElement('div',{className:'prog-roman'},p.roman),
                  React.createElement('div',{className:'prog-chords-big'},chordNames),
                  React.createElement('div',{className:'prog-name-sm'},p.name)
                );
              })
          ),

          React.createElement('button',{className:'stop-btn',onClick:stopAll,
            style:{marginTop:'0.5rem'}},'⏹ Stop')
        ),

        /* I · IV · V */
        React.createElement('div',{className:'card'},
          React.createElement('div',{className:'card-title',style:{color:'var(--gold)'}},
            isMinor?'i · iv · v':'I · IV · V'),
          React.createElement('div',{className:'ivv-row'},
            [{r:isMinor?'i':'I',   note:tonic,clr:tonicClr, role:'Tonic'},
             {r:isMinor?'iv':'IV', note:IV,   clr:ivClr,    role:'Subdominant'},
             {r:isMinor?'v':'V',   note:V,    clr:vClr,     role:'Dominant'}
            ].map(({r,note,clr,role})=>
              React.createElement('button',{key:r,className:'c-btn',
                onClick:()=>{ if(!playing){ playChord(note,isMinor); postBus({root:toSharp(note),mode:isMinor?'aeolian':'ionian'}); }},
                style:{borderColor:clr,
                  boxShadow:flash&&flash.note===note?`0 0 20px ${clr}88`:'none',
                  background:flash&&flash.note===note?`${clr}22`:'transparent'}
              },
                React.createElement('div',{className:'c-roman',style:{color:clr}},r),
                React.createElement('div',{className:'c-name', style:{color:clr}},fmt(note)+(isMinor?'m':'')),
                React.createElement('div',{className:'c-role'},role)
              )
            )
          ),
          React.createElement('button',{className:'play-btn',disabled:playing,onClick:playIVV,
            style:{background:playing?'transparent':`linear-gradient(135deg,${tonicClr}44,${tonicClr}11)`,
              borderColor:playing?'rgba(255,255,255,.1)':tonicClr,
              color:playing?'rgba(255,255,255,.3)':'white'}
          },playing?'▶ Playing…':`▶ Play ${isMinor?'i·iv·v':'I·IV·V'} Sequence`)
        ),

        /* Major / Minor toggle — bottom */
        React.createElement('div',{className:'card'},
          React.createElement('div',{className:'mm-row'},
            React.createElement('button',{
              className:`mm-btn maj${!isMinor?' on':''}`,
              onClick:()=>{ setIsMinor(false); playChord(majorRoot,false); postBus({root:toSharp(majorRoot),mode:'ionian'}); }
            },'● Major'),
            React.createElement('button',{
              className:`mm-btn min${isMinor?' on':''}`,
              onClick:()=>{ setIsMinor(true); playChord(relMin,true); postBus({root:toSharp(relMin),mode:'aeolian'}); }
            },'◉ Minor')
          ),
          React.createElement('p',{className:'rel-note',style:{margin:'0.4rem 0 0'}},
            isMinor
              ? fmt(tonic)+'m  ·  relative major: '+fmt(relMaj)
              : fmt(majorRoot)+' major  ·  relative minor: '+fmt(relMin)+'m')
        )

      ) /* end right panel */
    ) /* end grid */
  ); /* end wrap */
}

ReactDOM.render(React.createElement(MusicCircle), document.getElementById('root'));

/* ── KCM Console bridge listener ─────────────────────────────── */
(function(){
  window.addEventListener('message',function(ev){
    try{
      if(!ev.data) return;
      if(ev.data.type==='KCM_STOP'){
        // Stop all timers and suspend audio context
        if(window._kcmCoFStop) window._kcmCoFStop();
        return;
      }
      if(ev.data.type!=='KCM_STATE') return;
      const p=ev.data.payload; if(!p||!p.root) return;
      const flat=(S2F[p.root])||p.root;
      if(window._kcmCoF){
        window._kcmCoF.setRoot(flat);
        window._kcmCoF.setIsMinor(p.mode==='aeolian');
      }
      console.log('[KCM→CoF] root='+p.root+'→'+flat);
    }catch(e){console.error('[KCM→CoF]',e);}
  });
  console.log('[KCM→CoF] bridge listener ready.');
})();
</script>
</body>
</html>
