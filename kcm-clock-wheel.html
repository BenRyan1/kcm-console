<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KCM 12-Color Chromatic Clock — Keys, Codes & Modes™</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:#0f0f1e;
  color:#E8E8E8;
  font-family:'Montserrat',sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:30px 20px;
}
.spectrum-strip{
  width:100%;max-width:700px;height:4px;border-radius:2px;
  background:linear-gradient(to right,#FFFF00,#FFC400,#FF8000,#FF4000,#FF0000,#C4007F,#8000FF,#4000FF,#0000FF,#007FFF,#00FF80,#80FF00,#FFFF00);
  margin-bottom:28px;
}
.eyebrow{
  font-family:'Cinzel',serif;font-size:11px;font-weight:400;
  letter-spacing:.35em;text-transform:uppercase;
  color:#F4D03F;margin-bottom:10px;text-align:center;
}
.title{
  font-family:'Cinzel',serif;font-size:clamp(20px,4vw,32px);font-weight:900;
  text-align:center;margin-bottom:6px;
  background:linear-gradient(135deg,#F4D03F,#4A7BA7);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.subtitle{
  font-size:12px;color:rgba(232,232,232,0.5);
  text-align:center;letter-spacing:.12em;text-transform:uppercase;
  margin-bottom:32px;
}
canvas{
  cursor:pointer;
  border-radius:50%;
  box-shadow:0 0 60px rgba(74,123,167,0.25), 0 0 120px rgba(0,0,0,0.5);
  max-width:min(520px,90vw);
  max-height:min(520px,90vw);
  width:100%;height:auto;
}
.info-panel{
  margin-top:28px;
  background:#1e2040;
  border:1px solid rgba(74,123,167,0.3);
  border-radius:12px;
  padding:18px 32px;
  text-align:center;
  min-width:min(420px,90vw);
  transition:border-color .3s;
}
.info-panel.active{border-color:var(--note-color,#F4D03F)}
.info-note{
  font-family:'Cinzel',serif;font-size:28px;font-weight:900;
  color:#F4D03F;line-height:1;margin-bottom:6px;
}
.info-details{font-size:12px;color:rgba(232,232,232,0.55);letter-spacing:.08em}
.info-octave{
  font-size:11px;color:rgba(232,232,232,0.4);
  margin-top:6px;letter-spacing:.15em;text-transform:uppercase;
}
.instruction{
  margin-top:20px;font-size:11px;color:rgba(232,232,232,0.3);
  letter-spacing:.12em;text-align:center;
}
.spectrum-strip{margin-top:28px;margin-bottom:0}
</style>
    <link rel="canonical" href="https://keyscodesandmodes.com/kcm-clock-wheel.html" />
  </head>
<body>

<div class="spectrum-strip" style="margin-bottom:28px;margin-top:0"></div>

<div class="eyebrow">Keys, Codes &amp; Modes™</div>
<div class="title">12-Color Chromatic Spectrum™</div>
<div class="subtitle">C = Yellow · 12 o'clock · Clockwise = Pitch Up · Cross 12 = New Octave</div>

<canvas id="wheel" width="600" height="600"></canvas>

<div class="info-panel" id="infoPanel">
  <div class="info-note" id="infoNote">—</div>
  <div class="info-details" id="infoDetails">Click any segment to hear its pitch</div>
  <div class="info-octave" id="infoOctave">Octave 4 · MIDI 60–71</div>
</div>

<div class="instruction">↻ Clockwise = higher pitch &nbsp;·&nbsp; Cross 12 o'clock = next octave</div>

<div class="spectrum-strip" style="margin-top:28px;width:100%;max-width:700px;height:4px;border-radius:2px;background:linear-gradient(to right,#FFFF00,#FFC400,#FF8000,#FF4000,#FF0000,#C4007F,#8000FF,#4000FF,#0000FF,#007FFF,#00FF80,#80FF00,#FFFF00)"></div>

<script>
// ── KCM CANONICAL 12-COLOR SYSTEM ──────────────────────────────────
// C=Yellow at 12 o'clock, clockwise = pitch up
// Crossing 12 o'clock clockwise = next octave
const NOTES = [
  { name:'C',  enharmonic:'',   color:'#FFFF00', midi:60, colorName:'Yellow'      },
  { name:'C♯', enharmonic:'D♭', color:'#FFC400', midi:61, colorName:'Amber'       },
  { name:'D',  enharmonic:'',   color:'#FF8000', midi:62, colorName:'Orange'      },
  { name:'D♯', enharmonic:'E♭', color:'#FF4000', midi:63, colorName:'Red-Orange'  },
  { name:'E',  enharmonic:'',   color:'#FF0000', midi:64, colorName:'Red'         },
  { name:'F',  enharmonic:'',   color:'#C4007F', midi:65, colorName:'Magenta'     },
  { name:'F♯', enharmonic:'G♭', color:'#8000FF', midi:66, colorName:'Violet'      },
  { name:'G',  enharmonic:'',   color:'#4000FF', midi:67, colorName:'Indigo'      },
  { name:'G♯', enharmonic:'A♭', color:'#0000FF', midi:68, colorName:'Blue'        },
  { name:'A',  enharmonic:'',   color:'#007FFF', midi:69, colorName:'Sky Blue'    },
  { name:'A♯', enharmonic:'B♭', color:'#00FF80', midi:70, colorName:'Mint'        },
  { name:'B',  enharmonic:'',   color:'#80FF00', midi:71, colorName:'Lime'        }
];

const canvas  = document.getElementById('wheel');
const ctx     = canvas.getContext('2d');
const CX      = 300, CY = 300, R = 300;
const OUTER   = R - 8;
const INNER   = 95;
const LABEL_R = (OUTER + INNER) / 2 + 2;
const TICK_R  = OUTER + 0;  // outer edge ticks

let octave    = 4;           // current octave (4 = middle C range)
let lastIdx   = -1;          // last clicked segment
let activeIdx = -1;          // currently highlighted
let audioCtx  = null;

// ── AUDIO ────────────────────────────────────────────────────────────
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function playNote(noteIdx, oct) {
  const ac   = getAudioCtx();
  const midi = NOTES[noteIdx].midi - 60 + (oct * 12) + 60 - 48; // C4=60 base, shift by octave
  const freq = midiToFreq(midi);
  const t    = ac.currentTime;

  // Rich tone: fundamental + octave + 5th harmonic
  [1, 2, 3].forEach((harmonic, i) => {
    const osc  = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = i === 0 ? 'sine' : 'sine';
    osc.frequency.setValueAtTime(freq * harmonic, t);
    gain.gain.setValueAtTime([0.5, 0.2, 0.1][i], t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 1.8);
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.start(t);
    osc.stop(t + 1.9);
  });
}

// ── GEOMETRY ─────────────────────────────────────────────────────────
// Segment i starts at angle: -90° + i*30° (so C starts at -90° = 12 o'clock)
// Each segment spans 30° (360°/12)
const SEG = (2 * Math.PI) / 12;
const START_ANGLE = -Math.PI / 2 - Math.PI / 12; // 12 o'clock, rotated -15° CCW

function segAngles(i) {
  const a1 = START_ANGLE + i * SEG;
  const a2 = a1 + SEG;
  return { a1, a2, mid: (a1 + a2) / 2 };
}

function hitTest(x, y) {
  const dx = x - CX, dy = y - CY;
  const r  = Math.sqrt(dx*dx + dy*dy);
  if (r < INNER || r > OUTER) return -1;
  let angle = Math.atan2(dy, dx); // -PI to PI
  // Normalize to 0..2PI starting from 12 o'clock
  angle = angle - START_ANGLE;
  if (angle < 0) angle += 2 * Math.PI;
  return Math.floor(angle / SEG) % 12;
}

// ── DRAW ─────────────────────────────────────────────────────────────
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}

function drawWheel() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // ── Background circle ──
  ctx.save();
  ctx.beginPath();
  ctx.arc(CX, CY, OUTER + 4, 0, 2*Math.PI);
  ctx.fillStyle = '#0f0f1e';
  ctx.fill();
  ctx.restore();

  // ── 12 Segments ──
  NOTES.forEach((note, i) => {
    const { a1, a2, mid } = segAngles(i);
    const isActive = (i === activeIdx);
    const rgb = hexToRgb(note.color);

    ctx.save();

    // Glow for active
    if (isActive) {
      ctx.shadowColor = note.color;
      ctx.shadowBlur  = 36;
    }

    // Segment path
    ctx.beginPath();
    ctx.moveTo(CX + INNER * Math.cos(a1), CY + INNER * Math.sin(a1));
    ctx.arc(CX, CY, OUTER, a1, a2);
    ctx.arc(CX, CY, INNER, a2, a1, true);
    ctx.closePath();

    // Fill
    const opacity = isActive ? 1.0 : 0.82;
    ctx.fillStyle = isActive
      ? note.color
      : `rgba(${rgb.r},${rgb.g},${rgb.b},${opacity})`;
    ctx.fill();

    // Stroke between segments
    ctx.strokeStyle = '#0f0f1e';
    ctx.lineWidth   = 2;
    ctx.stroke();

    ctx.restore();

    // ── Note label — always upright (counter-rotated) ──
    const lx = CX + LABEL_R * Math.cos(mid);
    const ly = CY + LABEL_R * Math.sin(mid);

    ctx.save();
    ctx.translate(lx, ly);
    ctx.rotate(mid + Math.PI / 2); // keep upright
    // Actually: always draw upright
    ctx.rotate(-(mid + Math.PI / 2));

    // Determine text color (dark notes need dark text)
    const isLight = ['#FFFF00','#FFC400','#00FF80','#80FF00'].includes(note.color);
    ctx.fillStyle   = isActive ? (isLight ? '#111' : '#fff') : (isLight ? 'rgba(0,0,0,0.8)' : 'rgba(255,255,255,0.92)');
    ctx.shadowColor = isActive ? 'rgba(0,0,0,0.5)' : 'transparent';
    ctx.shadowBlur  = isActive ? 4 : 0;
    ctx.font        = `bold ${note.name.length > 1 ? 15 : 18}px 'Cinzel', serif`;
    ctx.textAlign   = 'center';
    ctx.textBaseline= 'middle';
    ctx.fillText(note.name, 0, 0);
    ctx.restore();
  });

  // ── Clock hour tick marks (outside ring) ──
  for (let i = 0; i < 12; i++) {
    const angle = START_ANGLE + i * SEG + SEG / 2;
    const isC   = (i === 0);
    const x1 = CX + (OUTER - 1) * Math.cos(angle);
    const y1 = CY + (OUTER - 1) * Math.sin(angle);
    const x2 = CX + (OUTER + (isC ? 16 : 10)) * Math.cos(angle);
    const y2 = CY + (OUTER + (isC ? 16 : 10)) * Math.sin(angle);
    ctx.save();
    ctx.strokeStyle = isC ? '#F4D03F' : 'rgba(232,232,232,0.25)';
    ctx.lineWidth   = isC ? 3 : 1.5;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
  }

  // ── Segment divider spokes at exact 12-1-2... positions ──
  for (let i = 0; i < 12; i++) {
    const angle = START_ANGLE + i * SEG;
    const isHour12 = (i === 0);
    ctx.save();
    ctx.strokeStyle = isHour12 ? 'rgba(244,208,63,0.6)' : 'rgba(15,15,30,0.9)';
    ctx.lineWidth   = isHour12 ? 2 : 1.5;
    ctx.beginPath();
    ctx.moveTo(CX + INNER * Math.cos(angle), CY + INNER * Math.sin(angle));
    ctx.lineTo(CX + OUTER * Math.cos(angle), CY + OUTER * Math.sin(angle));
    ctx.stroke();
    ctx.restore();
  }

  // ── Inner hub ──
  // Dark center
  ctx.save();
  const hub = ctx.createRadialGradient(CX, CY, 0, CX, CY, INNER);
  hub.addColorStop(0, '#1e2040');
  hub.addColorStop(1, '#0f0f1e');
  ctx.beginPath();
  ctx.arc(CX, CY, INNER, 0, 2*Math.PI);
  ctx.fillStyle = hub;
  ctx.fill();
  ctx.restore();

  // Teal inner ring
  ctx.save();
  ctx.beginPath();
  ctx.arc(CX, CY, INNER, 0, 2*Math.PI);
  ctx.strokeStyle = '#008080';
  ctx.lineWidth   = 2.5;
  ctx.stroke();
  ctx.restore();

  // Center text
  ctx.save();
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';

  if (activeIdx >= 0) {
    // Active note display
    const n = NOTES[activeIdx];
    const isLight = ['#FFFF00','#FFC400','#00FF80','#80FF00'].includes(n.color);
    ctx.fillStyle = n.color;
    ctx.font      = 'bold 36px Cinzel, serif';
    ctx.fillText(n.name, CX, CY - 14);
    ctx.fillStyle = 'rgba(232,232,232,0.5)';
    ctx.font      = '13px Montserrat, sans-serif';
    ctx.fillText(n.colorName, CX, CY + 10);
    ctx.fillStyle = 'rgba(232,232,232,0.3)';
    ctx.font      = '11px Montserrat, sans-serif';
    ctx.fillText('OCT ' + octave, CX, CY + 28);
  } else {
    // Default hub text
    ctx.fillStyle = '#F4D03F';
    ctx.font      = 'bold 11px Cinzel, serif';
    ctx.letterSpacing = '2px';
    ctx.fillText('12-COLOR', CX, CY - 12);
    ctx.fillStyle = 'rgba(244,208,63,0.65)';
    ctx.font      = '9px Cinzel, serif';
    ctx.fillText('CHROMATIC', CX, CY + 2);
    ctx.fillText('SPECTRUM™', CX, CY + 14);
    ctx.fillStyle = 'rgba(232,232,232,0.2)';
    ctx.font      = '9px Montserrat, sans-serif';
    ctx.fillText('OCT ' + octave, CX, CY + 30);
  }
  ctx.restore();

  // ── Gold center dot (matches KCM logo) ──
  ctx.save();
  ctx.beginPath();
  ctx.arc(CX, CY - 30 + (activeIdx >= 0 ? 18 : 0), 0, 0, 0); // hidden, just structural
  ctx.restore();

  // 12 o'clock marker triangle (gold) ──
  ctx.save();
  const triAngle = START_ANGLE; // exactly 12
  const triTip   = OUTER + 22;
  const triBase  = OUTER + 8;
  const triHalf  = 7;
  ctx.beginPath();
  ctx.moveTo(
    CX + triTip * Math.cos(triAngle),
    CY + triTip * Math.sin(triAngle)
  );
  ctx.lineTo(
    CX + triBase * Math.cos(triAngle - 0.08) + triHalf * Math.cos(triAngle + Math.PI/2) * 0,
    CY + triBase * Math.sin(triAngle - 0.08)
  );
  // Simple gold triangle pointer at top
  const tx = CX, ty = CY - OUTER - 6;
  ctx.beginPath();
  ctx.moveTo(tx, ty - 14);
  ctx.lineTo(tx - 7, ty + 2);
  ctx.lineTo(tx + 7, ty + 2);
  ctx.closePath();
  ctx.fillStyle   = '#F4D03F';
  ctx.shadowColor = '#F4D03F';
  ctx.shadowBlur  = 10;
  ctx.fill();
  ctx.restore();

  // ── Outer ring border ──
  ctx.save();
  ctx.beginPath();
  ctx.arc(CX, CY, OUTER + 3, 0, 2*Math.PI);
  ctx.strokeStyle = 'rgba(74,123,167,0.35)';
  ctx.lineWidth   = 1.5;
  ctx.stroke();
  ctx.restore();
}

// ── INTERACTION ───────────────────────────────────────────────────────
function getCanvasXY(e) {
  const rect  = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  if (e.touches) {
    return {
      x: (e.touches[0].clientX - rect.left) * scaleX,
      y: (e.touches[0].clientY - rect.top)  * scaleY
    };
  }
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top)  * scaleY
  };
}

function activate(idx) {
  if (idx < 0) return;

  // Octave tracking: crossing 12 o'clock
  if (lastIdx >= 0) {
    // Clockwise cross: last=11 (B), now=0 (C) → octave up
    if (lastIdx === 11 && idx === 0) octave = Math.min(octave + 1, 8);
    // Counter-clockwise cross: last=0 (C), now=11 (B) → octave down
    if (lastIdx === 0  && idx === 11) octave = Math.max(octave - 1, 0);
  }

  lastIdx   = idx;
  activeIdx = idx;
  const n   = NOTES[idx];

  // Play audio
  playNote(idx, octave);

  // Update info panel
  const panel = document.getElementById('infoPanel');
  const midi  = n.midi - 60 + (octave * 12) + 12; // adjusted for octave
  const freq  = midiToFreq(midi);

  document.getElementById('infoNote').textContent    = n.name + (n.enharmonic ? ' / ' + n.enharmonic : '');
  document.getElementById('infoNote').style.color    = n.color;
  document.getElementById('infoDetails').textContent = n.colorName + ' · ' + freq.toFixed(2) + ' Hz · MIDI ' + midi;
  document.getElementById('infoOctave').textContent  = 'Octave ' + octave + ' · Clockwise ↑ pitch · Cross 12 = new octave';
  panel.style.setProperty('--note-color', n.color);
  panel.classList.add('active');

  drawWheel();

  // Fade highlight
  setTimeout(() => {
    activeIdx = -1;
    panel.classList.remove('active');
    drawWheel();
  }, 2000);
}

canvas.addEventListener('click', e => {
  const {x, y} = getCanvasXY(e);
  activate(hitTest(x, y));
});
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const {x, y} = getCanvasXY(e);
  activate(hitTest(x, y));
}, { passive: false });

// Initial draw
drawWheel();
</script>
</body>
</html>
