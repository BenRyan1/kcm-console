<!DOCTYPE html>
<!-- gate.html — KCM Console Session 9 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KCM Console — Access Required</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0a0a15;
    --teal:     #008080;
    --teal-lt:  #00c0c0;
    --gold:     #F4D03F;
    --purple:   #8B6BA3;
    --coral:    #CF7A5A;
    --text-pri: #e8e8f8;
    --text-sec: #b0b0cc;
    --border:   rgba(0,128,128,0.2);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100vh; background: var(--bg); color: var(--text-pri); font-family: 'Montserrat', sans-serif; }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0;
    background-image:
      radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.15) 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 72%, rgba(255,255,255,.10) 0%, transparent 100%),
      radial-gradient(1px 1px at 58% 14%, rgba(255,255,255,.13) 0%, transparent 100%),
      radial-gradient(1px 1px at 78% 52%, rgba(255,255,255,.09) 0%, transparent 100%),
      radial-gradient(1px 1px at 22% 88%, rgba(0,192,192,.18) 0%, transparent 100%);
    pointer-events: none;
  }
  .page {
    position: relative; z-index: 1; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2rem 1.5rem;
  }
  .brand {
    position: absolute; top: 1.6rem; left: 2rem;
    font-family: 'Cinzel', serif; font-size: 1rem; font-weight: 700;
    color: var(--teal-lt); letter-spacing: .12em; text-decoration: none;
  }
  .brand span { color: var(--gold); }
  .card {
    width: 100%; max-width: 460px;
    background: rgba(255,255,255,.03);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 2.8rem 2.4rem 2.4rem; text-align: center;
  }
  .clock-wrap { margin: 0 auto 1.8rem; width: 110px; height: 110px; }
  .clock-svg {
    width: 110px; height: 110px;
    animation: spin 40s linear infinite;
    filter: drop-shadow(0 0 14px rgba(0,128,128,.4));
  }
  .clock-wrap:hover .clock-svg { animation-play-state: paused; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-family: 'Cinzel', serif; font-size: 1.45rem; font-weight: 700; color: var(--text-pri); margin-bottom: .4rem; }
  h1 em { font-style: normal; color: var(--teal-lt); }
  .sub { font-size: .82rem; color: var(--text-sec); line-height: 1.6; margin-bottom: 2rem; }
  .field-label { font-size: .7rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--teal-lt); display: block; text-align: left; margin-bottom: .45rem; }
  .code-row { display: flex; gap: .5rem; margin-bottom: .6rem; }
  .code-input {
    flex: 1; background: rgba(255,255,255,.05); border: 1px solid var(--border);
    border-radius: 8px; padding: .72rem 1rem; color: var(--text-pri);
    font-family: 'Montserrat', sans-serif; font-size: .88rem; letter-spacing: .06em;
    outline: none; transition: border-color .2s;
  }
  .code-input::placeholder { color: #44446a; }
  .code-input:focus { border-color: var(--teal); }
  .btn-unlock {
    padding: .72rem 1.3rem; background: var(--teal); color: #fff; border: none;
    border-radius: 8px; font-family: 'Montserrat', sans-serif; font-size: .8rem;
    font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    cursor: pointer; transition: background .2s, transform .15s; white-space: nowrap;
  }
  .btn-unlock:hover:not(:disabled) { background: var(--teal-lt); transform: translateY(-1px); }
  .btn-unlock:disabled { opacity: .5; cursor: not-allowed; }
  .msg { min-height: 1.4em; font-size: .8rem; margin-bottom: 1.6rem; }
  .msg.error   { color: var(--coral); }
  .msg.success { color: #00cc80; }
  .msg.loading { color: var(--text-sec); }
  .or { display: flex; align-items: center; gap: .8rem; margin-bottom: 1.4rem; }
  .or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .or span { font-size: .72rem; color: var(--text-sec); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
  .btn-access {
    display: block; width: 100%; padding: .85rem 1rem;
    background: transparent; border: 1px solid var(--gold); border-radius: 8px;
    color: var(--gold); font-family: 'Montserrat', sans-serif; font-size: .85rem;
    font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    text-decoration: none; text-align: center;
    transition: background .2s, color .2s, transform .15s; margin-bottom: 1.4rem;
  }
  .btn-access:hover { background: var(--gold); color: #0a0a15; transform: translateY(-1px); }
  .fine-print { font-size: .72rem; color: #55556a; line-height: 1.7; }
  .fine-print a { color: var(--purple); text-decoration: none; }
  .fine-print a:hover { text-decoration: underline; }
  footer { position: absolute; bottom: 1.2rem; font-size: .7rem; color: #33334a; }
  @media (max-width: 480px) { .card { padding: 2rem 1.3rem 1.8rem; } }
</style>
</head>
<body>
<div class="page">

  <a class="brand" href="https://keyscodesandmodes.com">KCM <span>Console</span></a>

  <div class="card">

    <div class="clock-wrap">
      <svg class="clock-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <circle cx="60" cy="60" r="56" fill="none" stroke="rgba(0,128,128,0.12)" stroke-width="1"/>
        <g><circle cx="60" cy="6" r="7" fill="#FFFF00" opacity=".92"/><text x="60" y="10" text-anchor="middle" font-family="Cinzel,serif" font-size="5.5" font-weight="700" fill="#0a0a15">C</text></g>
        <g transform="rotate(30,60,60)"><circle  cx="60" cy="6" r="6" fill="#FFC400" opacity=".88"/><text x="60" y="9.5" text-anchor="middle" font-family="Cinzel,serif" font-size="4" font-weight="700" fill="#0a0a15">C#</text></g>
        <g transform="rotate(60,60,60)"><circle  cx="60" cy="6" r="6" fill="#FF8000" opacity=".88"/><text x="60" y="9.5" text-anchor="middle" font-family="Cinzel,serif" font-size="5" font-weight="700" fill="#0a0a15">D</text></g>
        <g transform="rotate(90,60,60)"><circle  cx="60" cy="6" r="6" fill="#FF4000" opacity=".88"/><text x="60" y="9.5" text-anchor="middle" font-family="Cinzel,serif" font-size="4" font-weight="700" fill="#fff">D#</text></g>
        <g transform="rotate(120,60,60)"><circle cx="60" cy="6" r="6" fill="#FF0000" opacity=".88"/><text x="60" y="9.5" text-anchor="middle" font-family="Cinzel,serif" font-size="5" font-weight="700" fill="#fff">E</text></g>
        <g transform="rotate(150,60,60)"><circle cx="60" cy="6" r="6" fill="#C4007F" opacity=".88"/><text x="60" y="9.5" text-anchor="middle" font-family="Cinzel,serif" font-size="5" font-weight="700" fill="#fff">F</text></g>
        <g transform="rotate(180,60,60)"><circle cx="60" cy="6" r="6" fill="#8000FF" opacity=".88"/><text x="60" y="9.5" text-anchor="middle" font-family="Cinzel,serif" font-size="4" font-weight="700" fill="#fff">F#</text></g>
        <g transform="rotate(210,60,60)"><circle cx="60" cy="6" r="6" fill="#4000FF" opacity=".88"/><text x="60" y="9.5" text-anchor="middle" font-family="Cinzel,serif" font-size="5" font-weight="700" fill="#fff">G</text></g>
        <g transform="rotate(240,60,60)"><circle cx="60" cy="6" r="6" fill="#0000FF" opacity=".88"/><text x="60" y="9.5" text-anchor="middle" font-family="Cinzel,serif" font-size="4" font-weight="700" fill="#fff">G#</text></g>
        <g transform="rotate(270,60,60)"><circle cx="60" cy="6" r="6" fill="#007FFF" opacity=".88"/><text x="60" y="9.5" text-anchor="middle" font-family="Cinzel,serif" font-size="5" font-weight="700" fill="#fff">A</text></g>
        <g transform="rotate(300,60,60)"><circle cx="60" cy="6" r="6" fill="#00FF80" opacity=".88"/><text x="60" y="9.5" text-anchor="middle" font-family="Cinzel,serif" font-size="4" font-weight="700" fill="#0a0a15">A#</text></g>
        <g transform="rotate(330,60,60)"><circle cx="60" cy="6" r="6" fill="#80FF00" opacity=".88"/><text x="60" y="9.5" text-anchor="middle" font-family="Cinzel,serif" font-size="5" font-weight="700" fill="#0a0a15">B</text></g>
        <circle cx="60" cy="60" r="16" fill="#0f0f1e" stroke="rgba(0,128,128,0.3)" stroke-width="1"/>
        <text x="60" y="58" text-anchor="middle" font-family="Cinzel,serif" font-size="4" fill="rgba(0,192,192,.8)" letter-spacing="1.5">KCM</text>
        <text x="60" y="65" text-anchor="middle" font-family="Cinzel,serif" font-size="3.5" fill="rgba(0,192,192,.5)" letter-spacing="1">CONSOLE</text>
      </svg>
    </div>

    <h1><em>KCM Console</em></h1>
    <p class="sub">A visual operating system for music theory.<br>Access required to continue.</p>

    <label class="field-label" for="codeInput">Enter Access Code</label>
    <div class="code-row">
      <input class="code-input" id="codeInput" type="text"
             placeholder="Your access code"
             autocomplete="off" spellcheck="false" autocapitalize="off">
      <button class="btn-unlock" id="codeBtn" onclick="verifyCode()">Unlock</button>
    </div>
    <div class="msg" id="msg"></div>

    <div class="or"><span>Don't have a code?</span></div>

    <a class="btn-access" href="https://keyscodesandmodes.com/offerings.html" target="_blank" rel="noopener">
      Get Access →
    </a>

    <p class="fine-print">
      School or district? <a href="https://keyscodesandmodes.com/superintendent.html">Educator access →</a><br>
      Questions? <a href="mailto:ben@keyscodesandmodes.com">ben@keyscodesandmodes.com</a>
    </p>

  </div>

  <footer>© 2026 Keys, Codes &amp; Modes™ · Benjamin Ryan</footer>

</div>
<script>
  (function () {
    var valid = ['kcm_premium_2026','kcm_founder_2026','kcm_school_2026','kcm_free_trial','SUPT2026KCM'];
    var t = localStorage.getItem('kcm_access');
    if (t && valid.indexOf(t) !== -1) window.location.replace('./index.html');
  })();

  async function verifyCode() {
    var input = document.getElementById('codeInput');
    var btn   = document.getElementById('codeBtn');
    var code  = input.value.trim();
    if (!code) { setMsg('Please enter your access code.', 'error'); return; }
    btn.disabled = true;
    setMsg('Verifying…', 'loading');
    try {
      var res  = await fetch('https://keyscodesandmodes.com/api/verify-code', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code })
      });
      var data = await res.json();
      if (data.valid) {
        localStorage.setItem('kcm_access', data.token || code);
        setMsg('✓ Access granted — loading Console…', 'success');
        setTimeout(function () { window.location.replace('./index.html'); }, 900);
      } else {
        setMsg('Invalid code. Please check and try again.', 'error');
        btn.disabled = false;
      }
    } catch (e) {
      var valid = ['kcm_premium_2026','kcm_founder_2026','kcm_school_2026','kcm_free_trial','SUPT2026KCM'];
      if (valid.indexOf(code) !== -1) {
        localStorage.setItem('kcm_access', code);
        setMsg('✓ Access granted — loading Console…', 'success');
        setTimeout(function () { window.location.replace('./index.html'); }, 900);
      } else {
        setMsg('Invalid code. Please check and try again.', 'error');
        btn.disabled = false;
      }
    }
  }

  function setMsg(t, type) {
    var el = document.getElementById('msg');
    el.textContent = t; el.className = 'msg ' + type;
  }

  document.getElementById('codeInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') verifyCode();
  });
</script>
</body>
</html>
